name: "GlueKube: check cluster health"
description: >-
  SSH through the bastion to a master and assert no pod is Pending or Failed.
  On failure, dumps nodes, all pods, a describe for each unhealthy pod, and the
  last 50 cluster events.

inputs:
  base-url:
    description: "AutoGlue API base url"
    required: true
  api-key:
    description: "AutoGlue API key, sent as the X-API-KEY header (secrets.AUTOGLUE_API_KEY)"
    required: true
  org-name:
    description: "AutoGlue org name, resolved to an org id via /orgs"
    required: true
  poll-timeout-seconds:
    description: >-
      How long a pod may stay unhealthy before the check fails. Pods are re-polled
      until this deadline, so one that is briefly not ready and recovers still
      passes; only a pod that stays broken (e.g. CrashLoopBackOff) fails. Keep it
      under the caller job's timeout-minutes.
    required: false
    default: "300"
  poll-interval-seconds:
    description: "Delay between polls"
    required: false
    default: "15"

runs:
  using: composite
  steps:
    # Needs curl, jq and ssh — all preinstalled on ubuntu-latest runners.
    # Reaching the bastion may require network setup (e.g. a Tailscale exit node)
    # that the CALLER is responsible for establishing before this step.
    - name: Check cluster health
      shell: bash
      env:
        BASE_URL: ${{ inputs.base-url }}
        API_KEY: ${{ inputs.api-key }}
        ORG_NAME: ${{ inputs.org-name }}
        # `||` guards a caller that forwards a present-but-EMPTY value: `default:`
        # only fills in for ABSENT inputs, and the script rejects a non-integer.
        POLL_TIMEOUT_SECONDS: ${{ inputs.poll-timeout-seconds || '300' }}
        POLL_INTERVAL_SECONDS: ${{ inputs.poll-interval-seconds || '15' }}
      run: bash "${{ github.action_path }}/check_cluster_health.sh"
