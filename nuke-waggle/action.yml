name: "GlueKube: nuke Waggle node pools"
description: >-
  Backstop cleanup: delete every Waggle node pool whose name starts with a
  prefix (default "test-"). Intended to run with if: always() so leftovers are
  removed even when apply or destroy failed.

inputs:
  token:
    description: "Waggle API bearer token (secrets.WAGGLE_TOKEN)"
    required: true
  base-url:
    description: "Waggle API base url"
    required: false
    default: "https://waggle.glueopshosted.rocks/api/v1"
  name-prefix:
    description: "Only node pools whose name starts with this are deleted. An empty value is refused by the script rather than matching everything."
    required: false
    default: "test-"
  max-rounds:
    description: "Max retry rounds"
    required: false
    default: "5"
  round-delay:
    description: "Seconds between rounds"
    required: false
    default: "5"
  dry-run:
    description: "List node pools without deleting them"
    required: false
    default: "false"
  verbose:
    description: "Enable debug logging"
    required: false
    default: "false"
  python-version:
    description: "Python to set up. An empty string skips actions/setup-python and uses whatever python is already on PATH."
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    # Skippable: setup-python mutates job-wide PATH, so a caller that manages its
    # own Python can opt out with python-version: "".
    - name: Set up Python
      if: ${{ inputs.python-version != '' }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Python dependencies
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --quiet --disable-pip-version-check \
          -r "${{ github.action_path }}/requirements.txt"

    - name: Nuke Waggle node pools
      shell: bash
      env:
        WAGGLE_TOKEN: ${{ inputs.token }}
        WAGGLE_BASE_URL: ${{ inputs.base-url }}
        WAGGLE_NAME_PREFIX: ${{ inputs.name-prefix }}
        # `||` fallbacks matter here: these become argparse ints, and
        # `--max-rounds ''` is an int('') crash, not a default.
        MAX_ROUNDS: ${{ inputs.max-rounds || '5' }}
        ROUND_DELAY: ${{ inputs.round-delay || '5' }}
        DRY_RUN: ${{ inputs.dry-run }}
        VERBOSE: ${{ inputs.verbose }}
        NUKE_SCRIPT: ${{ github.action_path }}/waggle_nuke.py
      run: |
        set -euo pipefail
        args=( --max-rounds "$MAX_ROUNDS" --round-delay "$ROUND_DELAY" )
        # `if` blocks rather than `[ x ] && args+=(...)`: a trailing false test
        # would exit 1 under `set -e`.
        if [ "$DRY_RUN" = "true" ]; then args+=( --dry-run ); fi
        if [ "$VERBOSE" = "true" ]; then args+=( --verbose ); fi
        python "$NUKE_SCRIPT" "${args[@]}"
