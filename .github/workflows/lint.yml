name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck + bash -n
        run: |
          set -euo pipefail
          shopt -s globstar
          for f in **/*.sh; do
            echo "::group::$f"
            bash -n "$f"
            shellcheck --severity=warning "$f"
            echo "::endgroup::"
          done

      # The remote-check body in check_cluster_health.sh is interpolated into
      # `sudo bash -c '...'`, so a single quote anywhere inside it terminates the
      # quoting early and breaks the health check at runtime — in every repo that
      # consumes this action at once. Only a comment guarded this before; now CI does.
      - name: "Guard: no single quotes in REMOTE_CHECK"
        run: |
          set -euo pipefail
          f=check-cluster-health/check_cluster_health.sh
          start=$(grep -n '^REMOTE_CHECK=.$' "$f" | cut -d: -f1)
          end=$(awk -v s="$start" 'NR>s && $0=="\x27" {print NR; exit}' "$f")
          if [ -z "${start:-}" ] || [ -z "${end:-}" ]; then
            echo "::error::could not locate the REMOTE_CHECK block in $f" >&2
            exit 1
          fi
          echo "REMOTE_CHECK block: lines $start..$end"
          body=$(sed -n "$((start+1)),$((end-1))p" "$f")
          if printf '%s' "$body" | grep -n "'"; then
            echo "::error file=$f::REMOTE_CHECK contains a single quote; it is interpolated into sudo bash -c '...' and must not." >&2
            exit 1
          fi
          echo "OK: no single quotes in the REMOTE_CHECK block"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Python syntax + ruff
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check ruff
          python -m py_compile nuke-autoglue/autoglue_nuke.py nuke-proxmox/proxmox_nuke.py
          ruff check nuke-autoglue nuke-proxmox

      # actionlint specifically catches the two most common composite-action
      # mistakes: a run: step missing `shell:`, and use of the `secrets` context
      # inside an action.yml (where it does not resolve).
      - name: actionlint
        run: |
          set -euo pipefail
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: Validate action.yml files parse and declare shell
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys, glob, yaml
          rc = 0
          for path in sorted(glob.glob("*/action.yml")):
              with open(path) as fh:
                  doc = yaml.safe_load(fh)
              runs = doc.get("runs", {})
              if runs.get("using") != "composite":
                  print(f"::error file={path}::runs.using must be 'composite'"); rc = 1
              for i, step in enumerate(runs.get("steps", [])):
                  if "run" in step and "shell" not in step:
                      print(f"::error file={path}::step {i} ({step.get('name')}) has run: but no shell:"); rc = 1
              print(f"OK {path}: {len(doc.get('inputs', {}))} inputs, {len(runs.get('steps', []))} steps")
          sys.exit(rc)
          PY
