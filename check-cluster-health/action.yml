name: "GlueKube: check cluster health"
description: >-
  SSH through the bastion to a master and assert the cluster reached its expected
  state: nodes joined and Ready, a control-plane node present and Ready, every pod
  healthy (containers ready, not just phase Running), and no container above the
  restart ceiling. Polls until the assertions hold or the deadline expires. On
  failure, dumps nodes, all pods, a describe plus previous logs for each unhealthy
  pod, and the last 50 cluster events.

inputs:
  base-url:
    description: "AutoGlue API base url"
    required: true
  api-key:
    description: "AutoGlue API key, sent as the X-API-KEY header (secrets.AUTOGLUE_API_KEY)"
    required: true
  org-name:
    description: "AutoGlue org name, resolved to an org id via /orgs"
    required: true
  cluster-name:
    description: >-
      This run's cluster name (secrets.AUTOGLUE_CLUSTER_NAME). Strongly recommended:
      it restricts the bastion/master lookup to this run's cluster, so a leftover
      cluster from a previous run cannot be checked instead. Without it the check
      relies entirely on the caller's pre-flight org nuke for isolation, and the
      failure mode is a false PASS.
    required: false
    default: ""
  health-timeout:
    description: >-
      Overall deadline in seconds. Assertions are re-evaluated until they all hold
      simultaneously or this expires, so a node or pod that is briefly not ready and
      recovers still passes; only something STUCK fails. Keep it under the caller
      job's timeout-minutes.
    required: false
    default: "900"
  health-poll-interval:
    description: "Seconds between polls"
    required: false
    default: "15"
  min-node-count:
    description: >-
      Optional floor on Ready nodes. Unset by default and deliberately so: the
      assertions derive everything else from the cluster itself. Set it only if a
      whole node pool failing to provision has actually bitten you — pods targeting
      the missing pool's labels go Pending and fail the pod assertions anyway.
    required: false
    default: ""
  max-restart-count:
    description: >-
      Per-container restart ceiling. Catches a crashloop that happens to be
      momentarily Ready at the instant it was polled.
    required: false
    default: "3"

  # ---------------------------------------------------------------------------
  # Upgrade-test inputs. All off by default, so an apply-only caller asserts
  # exactly what it did before these existed.
  # ---------------------------------------------------------------------------
  expected-kubelet-version:
    description: >-
      Kubernetes version every node must report, e.g. "v1.34.5". This is the
      version, NOT the GlueKube docker tag: pass v1.34.5, not v1.34.5-gluekube.33.
      Without it nothing here looks at a version at all, so a cluster whose
      upgrade silently did nothing passes every other assertion — it is Ready with
      healthy pods, just on the old version. Unset by default because it is
      meaningless for a build-from-scratch run, which has nothing to compare to.
    required: false
    default: ""
  require-schedulable:
    description: >-
      Set to "1" to fail if any node is cordoned or carries a leftover drain
      taint. Off by default because the Ready-condition check deliberately treats
      a cordoned node as healthy. Turn it on after an upgrade: the playbook
      cordons, drains and uncordons each node in turn, and the uncordon is a
      separate task rather than an `always:`, so anything failing in between
      strands that node SchedulingDisabled where nothing else here would notice.
    required: false
    default: ""
  smoke-test:
    description: >-
      Set to "1" to run the smoke checks after the assertions pass: apiserver
      /readyz, Service endpoints, and a real DNS query to the kube-dns ClusterIP.
      That last one exercises kube-proxy service routing and CoreDNS answering,
      both re-applied by `kubeadm upgrade apply` and neither covered by "every pod
      is Ready". Creates no pods and pulls no images.
    required: false
    default: ""
  smoke-timeout:
    description: >-
      Deadline for the smoke checks in seconds. Keep it, plus health-timeout,
      inside the caller job's timeout-minutes.
    required: false
    default: "300"
  smoke-poll-interval:
    description: "Seconds between smoke attempts"
    required: false
    default: "10"

runs:
  using: composite
  steps:
    # Needs curl, jq and ssh locally — all preinstalled on ubuntu-latest runners —
    # and python3 on the master, which the script checks for up front.
    # Reaching the bastion may require network setup (e.g. a Tailscale exit node)
    # that the CALLER is responsible for establishing before this step.
    - name: Check cluster health
      shell: bash
      env:
        BASE_URL: ${{ inputs.base-url }}
        API_KEY: ${{ inputs.api-key }}
        ORG_NAME: ${{ inputs.org-name }}
        CLUSTER_NAME: ${{ inputs.cluster-name }}
        # `||` guards a caller that forwards a present-but-EMPTY value: `default:`
        # only fills in for ABSENT inputs, and the script rejects a non-integer.
        HEALTH_TIMEOUT: ${{ inputs.health-timeout || '900' }}
        HEALTH_POLL_INTERVAL: ${{ inputs.health-poll-interval || '15' }}
        MAX_RESTART_COUNT: ${{ inputs.max-restart-count || '3' }}
        # No `||` fallback: empty is a meaningful value here (no floor).
        MIN_NODE_COUNT: ${{ inputs.min-node-count }}
        # Same reasoning — for all three of these, empty means "assertion off",
        # so a `||` default would silently switch them on for every caller.
        EXPECTED_KUBELET_VERSION: ${{ inputs.expected-kubelet-version }}
        REQUIRE_SCHEDULABLE: ${{ inputs.require-schedulable }}
        SMOKE_TEST: ${{ inputs.smoke-test }}
        SMOKE_TIMEOUT: ${{ inputs.smoke-timeout || '300' }}
        SMOKE_POLL_INTERVAL: ${{ inputs.smoke-poll-interval || '10' }}
      run: bash "${{ github.action_path }}/check_cluster_health.sh"
